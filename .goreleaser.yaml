version: 2

project_name: cti-mcp

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cti-mcp
    binary: cti-mcp
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers:
  - image_templates:
      - "ghcr.io/runaho/cti-mcp:{{ .Version }}"
      - "ghcr.io/runaho/cti-mcp:latest"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"

brews:
  - repository:
      owner: Runaho
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: https://github.com/Runaho/cti-mcp
    description: "CTI MCP server — Cyber Threat Intelligence for MCP-compatible AI clients"
    license: MIT
    test: |
      system "#{bin}/cti-mcp", "version"
    install: |
      bin.install "cti-mcp"

release:
  github:
    owner: Runaho
    name: cti-mcp
  draft: false
  prerelease: auto
